<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}{% endblock %} — RAC Vision</title>
    <meta name="robots" content="index, follow">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --black: #0d0d0d; --card: #161616; --border: #2a2a2a; --orange: #E8751A; --gray: #a8a8a8; }
        body { background: var(--black); color: #e6e6e6; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.75; }
        header { border-bottom: 1px solid var(--border); padding: 18px clamp(16px, 5vw, 48px); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        header img { height: 28px; width: auto; display: block; }
        header nav { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; }
        a { color: var(--orange); }
        header nav a { color: var(--gray); text-decoration: none; }
        header nav a[aria-current="page"] { color: #fff; font-weight: 700; }
        main { max-width: 820px; margin: 0 auto; padding: clamp(32px, 6vw, 64px) clamp(16px, 5vw, 32px) 80px; }
        h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.15; margin-bottom: 8px; color: #fff; }
        .vigencia { color: var(--gray); font-size: 14px; margin-bottom: 32px; }
        h2 { font-size: 20px; color: #fff; margin: 40px 0 12px; padding-top: 12px; border-top: 1px solid var(--border); }
        h3 { font-size: 16px; color: #fff; margin: 22px 0 8px; }
        p, li { font-size: 15.5px; }
        p + p { margin-top: 12px; }
        ul { padding-left: 22px; margin: 10px 0; }
        li + li { margin-top: 6px; }
        .resumen { background: var(--card); border-left: 3px solid var(--orange); padding: 18px 20px; margin: 24px 0; }
        .resumen p { font-size: 15px; }
        .tabla { overflow-x: auto; margin: 14px 0; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { color: var(--gray); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        code { background: #222; padding: 1px 6px; border-radius: 3px; font-size: 13.5px; }
        footer { border-top: 1px solid var(--border); padding: 24px clamp(16px, 5vw, 48px); font-size: 13px; color: var(--gray); text-align: center; }
    </style>
</head>
<body>
<header>
    <a href="/"><img src="{{ url_for('static', filename='logo_rac.png') }}" alt="RAC Vision — volver al inicio" width="84" height="28"></a>
    <nav aria-label="Documentos legales">
        <a href="{{ url_for('privacidad') }}" {% if pagina == 'privacidad' %}aria-current="page"{% endif %}>Privacidad</a>
        <a href="{{ url_for('cookies') }}" {% if pagina == 'cookies' %}aria-current="page"{% endif %}>Cookies</a>
        <a href="{{ url_for('terminos') }}" {% if pagina == 'terminos' %}aria-current="page"{% endif %}>Términos</a>
    </nav>
</header>
<main>
    {% block contenido %}{% endblock %}
</main>
<footer>© 2026 RAC Vision · Buenos Aires, Argentina · <a href="mailto:alex@racvision.org">alex@racvision.org</a></footer>
</body>
</html>
