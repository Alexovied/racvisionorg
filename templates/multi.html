<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAC Vision - Varias cámaras</title>
    <style>
        html, body { margin: 0; height: 100%; background: #0b0f17; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 4px; height: 100%; }
        iframe { width: 100%; height: 100%; min-height: 100vh; border: 0; }
    </style>
</head>
<body>
    <div class="grid">
        {% for n in camaras %}
        <iframe src="/app?cam={{ n }}" allow="camera" title="Cámara {{ n }}"></iframe>
        {% endfor %}
    </div>
</body>
</html>
